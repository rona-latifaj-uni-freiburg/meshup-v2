# ============================================================================
# EXPERIMENT A: TEXT-ONLY GUIDANCE (Baseline)
# ============================================================================
# Transform dinosaur_032 into a Parasaurolophus using ONLY text guidance.
# No target mesh provided - the diffusion model must figure out the shape
# purely from the text description.
#
# Parasaurolophus: A hadrosaurid (duck-billed) dinosaur known for its 
# distinctive backward-curving cranial crest.
#
# This is the BASELINE for comparison with target-mesh guided version.
# ============================================================================

seed: 42
gpu: 0
background: [1., 1., 1.]

# Source mesh: decimated dinosaur_032 (~7.5k vertices)
mesh: ./meshes/decimated/dinosaur_032_decimated.obj

# NO TARGET MESH - this is text-only!
# target_mesh: <not specified>

# Text prompt describing Parasaurolophus
text_prompt: "a Parasaurolophus dinosaur toy with backward curving head crest, a 3d rendering"

# Mesh processing
retriangulate: 0

# Render settings
bsdf: diffuse
score: SDS

# Logging
log: false

# Optimization parameters
lr: 0.003
epochs: 7000
guidance_scale: 100
image_weight: 100.0
batch_size: 8
accum_iter: 2
train_res: 512
resize_method: cubic

# Jacobian regularization
regularize_jacobians_weight: 40000

# Camera parameters
fov_min: 30.0
fov_max: 90.0
dist_min: 2.5
dist_max: 3.5
light_power: 5.0
elev_alpha: 1.0
elev_beta: 5.0
elev_max: 60.0
azim_min: 0.0
azim_max: 360.0
aug_loc: 0
aug_light: 1
aug_bkg: 1
adapt_dist: 1

# Logging intervals
log_interval: 5
log_interval_im: 200
log_elev: 30.0
log_fov: 60.0
log_dist: 3.0
log_res: 512
log_light_power: 3.0
log_mesh: true

# Diffusion model
model_size: XL
dtype: float16
cpu_offload: false
modified_cfg: false

# Semantic tracking
track_correspondence: true
color_method: position

# =============================================================================
# TARGET MESH GUIDANCE: DISABLED (this is text-only baseline)
# =============================================================================
use_target_mesh_guidance: false

# Source DINO loss (preserve source structure during deformation)
use_dino_loss: true
dino_model: dinov2_vits14_reg
dino_weight: 0.1
dino_warmup_epochs: 50

# Output
output_path: ./outputs/experiment_A_text_only_parasaurolophus
