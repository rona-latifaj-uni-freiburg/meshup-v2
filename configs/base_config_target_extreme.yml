seed: 8888
text_prompt: ""
gpu: 0
background: [1.,1.,1.]
# Mesh
mesh: ./meshes/hound.obj
retriangulate: 0
# Render settings
bsdf: diffuse
# Hyper-parameters
score: SDS

log: false
lr: 0.0025
epochs: 4000
# Aggressively reduce text/image pressure so target correspondence dominates.
guidance_scale: 8
image_weight: 25.0
regularize_jacobians_weight: 5000
batch_size: 8
accum_iter: 2
train_res: 512
resize_method: cubic

# Camera parameters
fov_min: 30.0
fov_max: 90.0
dist_min: 2.5
dist_max: 3.5
light_power: 5.0
elev_alpha: 1.0
elev_beta: 5.0
elev_max: 60.0
azim_min: 0.0
azim_max: 360.0
aug_loc: 0
aug_light: 1
aug_bkg: 1
adapt_dist: 1

log_interval: 5
log_interval_im: 150
log_elev: 30.0
log_fov: 60.0
log_dist: 3.0
log_res: 512
log_light_power: 3.0
log_mesh: true

# Diffusion
model_size: XL
dtype: float16
cpu_offload: false
modified_cfg: false

# Local deformation
local_def: 0
local_sel: ./selection_configs/spot_head_vertices_faces.ply
local_vert_face_sel: vert
invert_sel: 0
local_weight: false
target_vertice: 171

output_path: ./outputs/test
attn_ctrl_alphas: [0.8, 0.2]
